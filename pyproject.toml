[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melograph"
dynamic = ["version"]
description = "Turns piano recordings into engraved sheet music (MusicXML for MuseScore, PDF, MIDI)."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "DevEmperor", email = "contact@devemperor.net" }]
keywords = ["music", "transcription", "piano", "sheet music", "musicxml", "musescore"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
# PyTorch is best installed first from https://download.pytorch.org/whl/cpu (about 1 GB smaller
# than the default build with CUDA); melograph.sh does that on its first start.
dependencies = [
    "transkun>=2.0.1",
    "beat-this>=1.1.0",
    "music21>=9.1",
    "verovio>=4.3",
    "PySide6-Essentials>=6.8",
    "miniaudio>=1.59",
    "rich>=13",
    "numpy",
    "pretty_midi",
]

[project.optional-dependencies]
dev = ["pytest", "pyflakes"]

[project.urls]
Homepage = "https://github.com/DevEmperor/Melograph"

[project.scripts]
melograph = "melograph.cli:main"

[project.gui-scripts]
melograph-gui = "melograph.gui.app:main"

[tool.setuptools.packages.find]
include = ["melograph*"]

[tool.setuptools.package-data]
"melograph.gui" = ["*.desktop"]
"melograph.gui.icons" = ["*.svg"]
"melograph.gui.qml" = ["*.qml", "qmldir"]
"melograph.gui.qml.icons" = ["*.svg"]

[tool.setuptools.dynamic]
version = { attr = "melograph.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
